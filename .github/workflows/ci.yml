name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            Fiap.TechChallenge.Api.slnx
            **/*.csproj

      - name: Restore
        run: dotnet restore Fiap.TechChallenge.Api.slnx

      - name: Build
        run: dotnet build Fiap.TechChallenge.Api.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Fiap.TechChallenge.Api.slnx --configuration Release --no-build --verbosity normal