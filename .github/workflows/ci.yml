name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            fase1-tech-challenge.sln
            **/*.csproj

      - name: Restore
        run: dotnet restore fase1-tech-challenge.sln

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build fase1-tech-challenge.sln --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test fase1-tech-challenge.sln --configuration Release --no-build --verbosity normal --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Generate coverage report
        run: dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"TestResults/CoverageReport" -reporttypes:"Html;HtmlSummary"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/CoverageReport/
          retention-days: 30
