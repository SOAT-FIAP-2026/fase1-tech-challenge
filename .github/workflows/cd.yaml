name: CD

on:
  push:
    branches:
      # - main
      - feat/infra
  workflow_dispatch: # Permite execução manual pelo GitHub UI

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/techchallenge-api

permissions:
  contents: read

jobs:
  # ============================================================================
  # Job 1: Build e testes (garante que só faz deploy de código saudável)
  # ============================================================================
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Fiap.TechChallenge.Api/Fiap.TechChallenge.Api.csproj

      - name: Build
        run: dotnet build src/Fiap.TechChallenge.Api/Fiap.TechChallenge.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Fiap.TechChallenge.Api.slnx --configuration Release --verbosity normal

  # ============================================================================
  # Job 2: Build da imagem Docker e push para Docker Hub
  # ============================================================================
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extrair metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha256-

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================================================
  # Job 3: Deploy no Kubernetes
  # ============================================================================
  deploy-k8s:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: sa-east-1

      - name: Configurar Kubeconfig do EKS
        run: aws eks update-kubeconfig --name eks-fiap-soat-terraform --region sa-east-1

      - name: Aplicar manifestos Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/api-ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Atualizar imagem do Deployment
        run: |
          # O action docker/metadata-action gera a tag no formato sha256-{github.sha}
          kubectl set image deployment/api \
            api=${{ env.DOCKERHUB_IMAGE }}:sha256-${{ github.sha }} \
            -n techchallenge

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/api \
            -n techchallenge \
            --timeout=120s
