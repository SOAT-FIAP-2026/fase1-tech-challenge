name: CD

on:
  push:
    branches:
      - main
      - feat/infra
    paths:
      - "src/**"
      - "k8s/**"
      - ".github/workflows/cd.yaml"
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/techchallenge-api

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout shared contracts
        uses: actions/checkout@v7
        with:
          repository: SOAT-FIAP-2026/shared
          ref: main
          path: .shared
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Move shared to sibling directory (../shared)
        run: |
          rm -rf ../shared
          mv .shared ../shared

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore src/Fiap.TechChallenge.Api/Fiap.TechChallenge.Api.csproj
          dotnet restore tests/Fiap.TechChallenge.Tests/Fiap.TechChallenge.Tests.csproj

      - name: Build
        run: dotnet build src/Fiap.TechChallenge.Api/Fiap.TechChallenge.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Fiap.TechChallenge.Tests/Fiap.TechChallenge.Tests.csproj --configuration Release --verbosity normal

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout shared contracts
        uses: actions/checkout@v7
        with:
          repository: SOAT-FIAP-2026/shared
          ref: main
          path: .shared
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Move shared to sibling directory (../shared)
        run: |
          rm -rf ../shared
          mv .shared ../shared

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extrair metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha256-

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            shared=../shared
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploy automatizado num cluster Kubernetes efêmero (kind) com a imagem recém-publicada.
  # Usa o overlay k8s/overlays/local (namespace, Secret, PostgreSQL, Deployment, Service e HPA).
  deploy-k8s:
    runs-on: ubuntu-latest
    needs: docker-build-push
    env:
      CLUSTER_NAME: techchallenge-ci
      NAMESPACE: techchallenge
      MANIFEST_IMAGE: gabrielnetto94/techchallenge-api:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Baixar a imagem publicada
        run: |
          docker pull $DOCKERHUB_IMAGE:sha256-${{ github.sha }}
          docker tag $DOCKERHUB_IMAGE:sha256-${{ github.sha }} $MANIFEST_IMAGE

      - name: Criar cluster Kubernetes (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}

      - name: Carregar a imagem no cluster
        run: kind load docker-image $MANIFEST_IMAGE --name $CLUSTER_NAME

      - name: Aplicar manifestos (k8s/overlays/local)
        run: |
          chmod +x k8s/overlays/local/deploy.sh
          JWT_SECRET="$(openssl rand -hex 32)" POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
            ./k8s/overlays/local/deploy.sh kind

      - name: Smoke test
        run: |
          kubectl -n $NAMESPACE port-forward service/api-service 8080:80 > /tmp/port-forward.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "Health check falhou" >&2
          exit 1

      - name: Estado do cluster
        if: always()
        run: |
          kubectl -n $NAMESPACE get deployments,pods,services,hpa -o wide
          kubectl -n $NAMESPACE get deployment/api -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Diagnóstico
        if: failure()
        run: |
          kubectl -n $NAMESPACE describe deployment/api
          kubectl -n $NAMESPACE describe pods
          kubectl -n $NAMESPACE logs deployment/api --tail=200 || true

  # Deploy no EKS da AWS. Só roda com a variável de repositório DEPLOY_EKS=true,
  # depois de configurar os secrets AWS_ACCESS_KEY/AWS_SECRET_KEY e o cluster.
  deploy-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: vars.DEPLOY_EKS == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: sa-east-1

      - name: Configurar Kubeconfig do EKS
        run: aws eks update-kubeconfig --name eks-fiap-soat-terraform --region sa-east-1

      - name: Substituir secrets via envsubst
        env:
          JWT_SECRET_BASE64: ${{ secrets.JWT_SECRET_BASE64 }}
          DB_CONNECTION_BASE64: ${{ secrets.DB_CONNECTION_BASE64 }}
          DOCKER_CONFIG_JSON_BASE64: ${{ secrets.DOCKER_CONFIG_JSON_BASE64 }}
        run: |
          # Validar que as variáveis obrigatórias estão definidas
          if [ -z "$JWT_SECRET_BASE64" ] || [ -z "$DB_CONNECTION_BASE64" ] || [ -z "$DOCKER_CONFIG_JSON_BASE64" ]; then
            echo "❌ Erro: Uma ou mais variáveis de secrets não estão definidas no GitHub Actions."
            echo "Variáveis obrigatórias:"
            echo "  - JWT_SECRET_BASE64"
            echo "  - DB_CONNECTION_BASE64"
            echo "  - DOCKER_CONFIG_JSON_BASE64"
            exit 1
          fi

          # Substituir as variáveis no template
          envsubst < k8s/overlays/aws/secrets.yaml.template > k8s/overlays/aws/secrets.yaml

          echo "✅ Secrets gerados com sucesso via envsubst"

      - name: Aplicar manifestos Kubernetes
        run: |
          # O script de deploy usa o padrão base+overlays para aplicar na ordem correta
          chmod +x k8s/overlays/aws/deploy.sh
          ./k8s/overlays/aws/deploy.sh

      - name: Atualizar imagem do Deployment
        run: |
          # O action docker/metadata-action gera a tag no formato sha256-{github.sha}
          kubectl set image deployment/api \
            api=$DOCKERHUB_IMAGE:sha256-${{ github.sha }} \
            -n techchallenge

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/api \
            -n techchallenge \
            --timeout=120s
