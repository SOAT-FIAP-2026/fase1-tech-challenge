name: CD

on:
  push:
    branches:
      # - main #Deploy desabilitado no momento, pois o EKS está desligado
      - feat/infra
    paths:
      - "src/**"
      - "k8s/**"
      - ".github/workflows/cd.yaml"
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/techchallenge-api

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Fiap.TechChallenge.Api/Fiap.TechChallenge.Api.csproj

      - name: Build
        run: dotnet build src/Fiap.TechChallenge.Api/Fiap.TechChallenge.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Fiap.TechChallenge.Api.slnx --configuration Release --verbosity normal

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extrair metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha256-

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: sa-east-1

      - name: Configurar Kubeconfig do EKS
        run: aws eks update-kubeconfig --name eks-fiap-soat-terraform --region sa-east-1

      - name: Substituir secrets via envsubst
        env:
          JWT_SECRET_BASE64: ${{ secrets.JWT_SECRET_BASE64 }}
          DB_CONNECTION_BASE64: ${{ secrets.DB_CONNECTION_BASE64 }}
          DOCKER_CONFIG_JSON_BASE64: ${{ secrets.DOCKER_CONFIG_JSON_BASE64 }}
        run: |
          # Validar que as variáveis obrigatórias estão definidas
          if [ -z "$JWT_SECRET_BASE64" ] || [ -z "$DB_CONNECTION_BASE64" ] || [ -z "$DOCKER_CONFIG_JSON_BASE64" ]; then
            echo "❌ Erro: Uma ou mais variáveis de secrets não estão definidas no GitHub Actions."
            echo "Variáveis obrigatórias:"
            echo "  - JWT_SECRET_BASE64"
            echo "  - DB_CONNECTION_BASE64"
            echo "  - DOCKER_CONFIG_JSON_BASE64"
            exit 1
          fi
          
          # Substituir as variáveis no template
          envsubst < k8s/overlays/aws/secrets.yaml.template > k8s/overlays/aws/secrets.yaml
          
          echo "✅ Secrets gerados com sucesso via envsubst"

      - name: Aplicar manifestos Kubernetes
        run: |
          # O script de deploy usa o padrão base+overlays para aplicar na ordem correta
          chmod +x k8s/overlays/aws/deploy.sh
          ./k8s/overlays/aws/deploy.sh

      - name: Atualizar imagem do Deployment
        run: |
          # O action docker/metadata-action gera a tag no formato sha256-{github.sha}
          kubectl set image deployment/api \
            api=$DOCKERHUB_IMAGE:sha256-${{ github.sha }} \
            -n techchallenge

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/api \
            -n techchallenge \
            --timeout=120s
