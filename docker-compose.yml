services:
  # ===========================================================================
  # PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:16
    container_name: techchallenge_postgres
    restart: always
    environment:
      POSTGRES_DB: techchallengedb-dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-dev:
    container_name: techchallenge_api_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=techchallengedb-dev;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    volumes:
      - .:/src
    working_dir: /src
    command: ["dotnet", "watch", "--project", "src/Fiap.TechChallenge.Api/Fiap.TechChallenge.Api.csproj", "run", "--no-launch-profile"]

  # ===========================================================================
  # API — Produção (imagem otimizada multi-stage)
