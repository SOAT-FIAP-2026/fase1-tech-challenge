version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: techchallenge_postgres
    restart: always
    environment:
      POSTGRES_DB: techchallengedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bd/TechChallenge-fase1.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
volumes:
  postgres_data:
