# ==============================================================================
# Service — LOCAL (Minikube / Kind)
# NodePort: acessível via http://localhost:<nodePort> ou minikube service
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: techchallenge
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: techchallenge
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080    # http://localhost:30080 (após port-forward ou minikube tunnel)
      protocol: TCP
      name: http
