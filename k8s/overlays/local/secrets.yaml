# ==============================================================================
# Secret — LOCAL (Minikube / Kind)
# Banco de dados: PostgreSQL rodando no pod local.
# ==============================================================================
# Para gerar os valores base64:
#   echo -n "valor" | base64
#
# Ou criar diretamente via kubectl:
#   kubectl create secret generic api-secret \
#     --namespace=techchallenge \
#     --from-literal=Jwt__Secret="QiIRd2qKY47zz0b8J367SqKaOYOPBTCu" \
#     --from-literal=ConnectionStrings__DefaultConnection="Host=postgres-service;Port=5432;Database=techchallengedb;Username=postgres;Password=postgres" \
#     --dry-run=client -o yaml
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: techchallenge
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: techchallenge
    app.kubernetes.io/environment: local
type: Opaque
data:
  # JWT Secret: QiIRd2qKY47zz0b8J367SqKaOYOPBTCu
  Jwt__Secret: "UWlJUmQycUtZNDd6ejBiOEozNjdTcUthT1lPUEJUQ3U="

stringData:
  # ConnectionString local: Host=postgres-service;Port=5432;Database=techchallengedb;Username=postgres;Password=postgres
  ConnectionStrings__DefaultConnection: "Host=postgres-service;Port=5432;Database=techchallengedb;Username=postgres;Password=postgres"
